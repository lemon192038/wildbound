name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node server/test.mjs
      # Static build. GitHub Pages cannot run the WebSocket server, so co-op connects to the
      # server deployed on Render/Fly when the repo variable WILDBOUND_SERVER_URL is set
      # (Settings → Secrets and variables → Actions → Variables, e.g. wss://wildbound.onrender.com).
      # Without it the Pages build is solo/offline.
      - run: npx vite build
        env:
          VITE_STATIC: '1'
          VITE_SERVER_URL: ${{ vars.WILDBOUND_SERVER_URL || 'wss://wildbound-jl72.onrender.com' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
